name: Validate anonymous inbox

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/inbox.mjs"
      - ".github/workflows/inbox.yml"
      - ".github/ai-bridge-inbox-state.json"
      - ".github/workflows/inbox-validation.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check scripts/inbox.mjs
      - name: Check whitespace errors
        run: git diff --check
