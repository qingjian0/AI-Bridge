name: Validate anonymous inbox

on:
  push:
    branches: [main, hardening/anonymous-inbox]
    paths:
      - "scripts/inbox.mjs"
      - ".github/workflows/inbox.yml"
      - ".github/ai-bridge-inbox-state.json"
      - ".github/workflows/inbox-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/inbox.mjs"
      - ".github/workflows/inbox.yml"
      - ".github/ai-bridge-inbox-state.json"
      - ".github/workflows/inbox-validation.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: node --check scripts/inbox.mjs
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
