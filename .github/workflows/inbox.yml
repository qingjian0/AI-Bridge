name: Anonymous Inbox Bridge

# Anonymous senders publish to the public ntfy topic; this workflow relays
# bounded, untrusted text into Discussion #4. No Pages-side credentials.
on:
  push:
    branches: [main]
    paths:
      - "scripts/inbox.mjs"
      - ".github/workflows/inbox.yml"
      - ".github/ai-bridge-inbox-state.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "24"
      - name: Relay anonymous messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INBOX_TOPIC: ai-bridge-inbox-qingjian0
          DISCUSSION_NUMBER: "4"
        run: node scripts/inbox.mjs
      - name: Persist deduplication cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-bridge-inbox-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(inbox): persist anonymous message cursor"
            git push
          fi
