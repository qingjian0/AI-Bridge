name: ChatGPT Initiated Relay Smoke Test Receipt

on:
  push:
    branches: [hardening/anonymous-inbox]
    paths:
      - ".github/workflows/chatgpt-relay-smoke-receipt.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish and persist the ntfy receipt
        env:
          TOPIC: ai-bridge-inbox-qingjian0
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE="AI-Bridge ChatGPT-authored relay smoke test. Initiated by ChatGPT; HTTP POST executed by an ephemeral GitHub Actions runner. run_id=${RUN_ID}; attempt=${RUN_ATTEMPT}. Real anonymous-topic publication."
          curl --fail-with-body --silent --show-error \
            --request POST "https://ntfy.sh/${TOPIC}" \
            --header "Title: ChatGPT initiated relay smoke test (Actions transport)" \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary "${MESSAGE}" \
            --output ntfy-response.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("ntfy-response.json", "utf8"));
            if (r.event !== "message" || r.topic !== process.env.TOPIC || !r.id) throw new Error("Invalid ntfy receipt");
            console.log("PUBLISH_CONFIRMED id=" + r.id + " time=" + r.time + " topic=" + r.topic);
          '
          mkdir -p test-results
          printf '{"run_id":"%s","attempt":"%s","ntfy":' "${RUN_ID}" "${RUN_ATTEMPT}" > "test-results/chatgpt-ntfy-post-${RUN_ID}.json"
          cat ntfy-response.json >> "test-results/chatgpt-ntfy-post-${RUN_ID}.json"
          printf '}\n' >> "test-results/chatgpt-ntfy-post-${RUN_ID}.json"
          gh api --method PUT "repos/qingjian0/AI-Bridge/contents/test-results/chatgpt-ntfy-post-${RUN_ID}.json" \
            --field message="test(inbox): record ntfy smoke test response" \
            --field content="$(base64 -w0 "test-results/chatgpt-ntfy-post-${RUN_ID}.json")" \
            --field branch="hardening/anonymous-inbox"
          echo "Dispatching the main-branch anonymous inbox relay..."
          gh api --method POST "repos/qingjian0/AI-Bridge/actions/workflows/inbox.yml/dispatches" --field ref="main"
          echo "INBOX_DISPATCH_REQUESTED"
